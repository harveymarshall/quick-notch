name: QuickNotch
options:
  bundleIdPrefix: com.harvey
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  QuickNotch:
    type: application
    platform: macOS
    sources:
      - path: QuickNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harvey.QuickNotch
        PRODUCT_NAME: QuickNotch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: QuickNotch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: QuickNotch/QuickNotch.entitlements
        ENABLE_HARDENED_RUNTIME: true
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
    info:
      path: QuickNotch/Info.plist
      properties:
        CFBundleName: QuickNotch
        CFBundleDisplayName: Quick Notch
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Copyright © 2026
